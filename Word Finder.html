<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Finder</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f1d1a;--mute:#7a746b;--line:#e4dfd6;--acc:#b4451f;--chip:#f3eee5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--ink:#f1ece4;--mute:#9a9288;--line:#36312b;--acc:#f08a5d;--chip:#2a2622;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--ink:#f1ece4;--mute:#9a9288;--line:#36312b;--acc:#f08a5d;--chip:#2a2622;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:32px 18px 48px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.5px}
p.sub{margin:0 0 22px;color:var(--mute);font-family:system-ui,sans-serif;font-size:14px}
input{width:100%;font:inherit;font-size:24px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
.modes{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;font-family:system-ui,sans-serif}
.modes button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 13px;border-radius:99px;font-size:13px;cursor:pointer}
.modes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.count{font-family:system-ui,sans-serif;font-size:13px;color:var(--mute);margin:12px 2px}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:18px;overflow-wrap:anywhere}
li b{color:var(--acc);font-weight:700}
.empty{color:var(--mute);font-style:italic;padding:18px 2px}
</style>
</head>
<body>
<main>
<h1>Word Finder</h1>
<p class="sub">Type some letters and see the English words that match.</p>
<input id="q" type="text" placeholder="e.g. pre" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
<div class="modes" id="modes">
<button data-m="start" class="on">Starts with</button>
<button data-m="contain">Contains</button>
<button data-m="end">Ends with</button>
</div>
<div class="count" id="count"></div>
<ul id="list"></ul>
<div class="empty" id="empty" hidden>No matching words in this list.</div>
</main>

const WORDS=[...new Set(RAW.split(/\s+/).filter(Boolean))].sort();
const q=document.getElementById('q'),list=document.getElementById('list'),count=document.getElementById('count'),empty=document.getElementById('empty');
let mode='start';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
  const t=q.value.trim().toLowerCase().replace(/[^a-z]/g,'');
  list.innerHTML='';empty.hidden=true;
  if(!t){count.textContent=WORDS.length.toLocaleString()+' words in the dictionary';return;}
  const hits=WORDS.filter(w=>mode==='start'?w.startsWith(t):mode==='end'?w.endsWith(t):w.includes(t));
  count.textContent=hits.length?hits.length+' match'+(hits.length>1?'es':'')+(hits.length>120?' (showing first 120)':''):'';
  empty.hidden=hits.length>0;
  list.innerHTML=hits.slice(0,120).map(w=>{
    const i=mode==='end'?w.length-t.length:w.indexOf(t);
    return '<li>'+esc(w.slice(0,i))+'<b>'+esc(t)+'</b>'+esc(w.slice(i+t.length))+'</li>';
  }).join('');
}
q.addEventListener('input',render);
document.getElementById('modes').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;
  document.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
render();
</script>
