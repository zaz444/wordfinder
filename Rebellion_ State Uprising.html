<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rebellion: State Uprising</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--sea:#cfe2f3;--l1:#f3efe2;--l2:#e4ecd9;--l3:#f1e1cf;--bg:#e9ecf1;--card:#fff;--tx:#151a23;--mu:#586174;--bd:#cfd5df;--ac:#2a63c9;--rd:#b3261e;--gn:#2b7a3f;--yl:#a56a00;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--sea:#12202f;--l1:#2b3444;--l2:#29393a;--l3:#3a3430;--bg:#10141b;--card:#1a202b;--tx:#e8ecf2;--mu:#9aa5b8;--bd:#2c3546;--ac:#6aaaff;--rd:#ff6e66;--gn:#62d68f;--yl:#f0b955;--on:#07101e}}
:root[data-theme="dark"]{color-scheme:dark;--sea:#12202f;--l1:#2b3444;--l2:#29393a;--l3:#3a3430;--bg:#10141b;--card:#1a202b;--tx:#e8ecf2;--mu:#9aa5b8;--bd:#2c3546;--ac:#6aaaff;--rd:#ff6e66;--gn:#62d68f;--yl:#f0b955;--on:#07101e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font:700 24px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 2px}
.mu{color:var(--mu);font-size:14px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.card.grid{gap:10px 14px}
button,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
button{text-align:left;cursor:pointer}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button small{display:block;color:var(--mu);font-size:12px}
button.pri{background:var(--ac);color:var(--on);border:0;text-align:center;font-weight:600}
button.bad{background:var(--rd);color:var(--on)}
select{width:100%}
.st{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;margin-bottom:3px}
.st b{color:var(--tx)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.bub{display:flex;gap:12px;align-items:flex-start;min-height:80px;margin:6px 0}
.fc{flex:none;width:60px;text-align:center;font-size:11px;color:var(--mu)}
.fc svg{width:60px;height:60px;border-radius:50%;background:var(--bg);border:2px solid}
.sp{position:relative;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;flex:1}
.sp:before{content:"";position:absolute;left:-8px;top:20px;width:14px;height:14px;background:var(--bg);border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);transform:rotate(45deg)}
.loss{border:2px solid var(--rd)}
.loss h2{font:700 21px/1.2 Georgia,serif;color:var(--rd);margin:0 0 8px}
.loss p,.loss li{margin:8px 0}
.win{border:2px solid var(--gn)}
.win h2{font:700 21px/1.2 Georgia,serif;color:var(--gn);margin:0 0 8px}
.map svg{display:block;width:100%;height:auto;max-width:380px;margin:0 auto}
.map text{font-family:system-ui,sans-serif;font-weight:600;pointer-events:none}
#map path{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.round(rnd(a,b)),cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const D={
US:"Alabama,Alaska,Arizona,Arkansas,California,Colorado,Connecticut,Delaware,Florida,Georgia,Hawaii,Idaho,Illinois,Indiana,Iowa,Kansas,Kentucky,Louisiana,Maine,Maryland,Massachusetts,Michigan,Minnesota,Mississippi,Missouri,Montana,Nebraska,Nevada,New Hampshire,New Jersey,New Mexico,New York,North Carolina,North Dakota,Ohio,Oklahoma,Oregon,Pennsylvania,Rhode Island,South Carolina,South Dakota,Tennessee,Texas,Utah,Vermont,Virginia,Washington,West Virginia,Wisconsin,Wyoming",
CA:"Alberta,British Columbia,Manitoba,New Brunswick,Newfoundland and Labrador,Nova Scotia,Ontario,Prince Edward Island,Quebec,Saskatchewan,Northwest Territories,Nunavut,Yukon",
MX:"Aguascalientes,Baja California,Baja California Sur,Campeche,Chiapas,Chihuahua,Coahuila,Colima,Durango,Guanajuato,Guerrero,Hidalgo,Jalisco,Mexico State,Mexico City,Michoacán,Morelos,Nayarit,Nuevo León,Oaxaca,Puebla,Querétaro,Quintana Roo,San Luis Potosí,Sinaloa,Sonora,Tabasco,Tamaulipas,Tlaxcala,Veracruz,Yucatán,Zacatecas"};
Object.keys(D).forEach(k=>D[k]=D[k].split(","));
const ctry=s=>D.US.includes(s)?"US":D.CA.includes(s)?"CA":"MX";
const T={
US:"AL6,5 AK0,0 AZ1,4 AR4,4 CA0,3 CO2,3 CT9,2 DE8,4 FL8,6 GA7,5 HI0,6 ID1,1 IL5,2 IN6,2 IA4,2 KS3,4 KY5,3 LA4,5 ME10,0 MD8,3 MA10,2 MI7,1 MN4,1 MS5,5 MO4,3 MT2,1 NE3,3 NV1,2 NH10,1 NJ9,3 NM2,4 NY8,1 NC6,4 ND3,1 OH7,2 OK3,5 OR0,2 PA8,2 RI10,3 SC7,4 SD3,2 TN5,4 TX3,6 UT1,3 VT9,1 VA7,3 WA0,1 WV6,3 WI5,1 WY2,2",
CA:"AB2,1 BC1,1 MB4,1 NB7,1 NL8,0 NS8,1 ON5,1 PE7,0 QC6,1 SK3,1 NT2,0 NU4,0 YT1,0",
MX:"AGU3,2 BC0,0 BCS0,1 CAM8,4 CHP7,5 CHH2,0 COA3,0 COL1,3 DUR2,1 GUA4,2 GRO2,4 HID6,2 JAL2,2 MEX3,3 CDMX4,3 MIC2,3 MOR4,4 NAY1,2 NLE4,0 OAX6,4 PUE6,3 QUE5,2 ROO9,3 SLP4,1 SIN1,1 SON1,0 TAB7,4 TAM5,0 TLA5,3 VER7,2 YUC8,3 ZAC3,1"};
const OY={US:2,CA:0,MX:10},TL=[];
for(const k in T)[...T[k].matchAll(/([A-Z]+)(\d+),(\d+)/g)].forEach((m,i)=>TL.push({n:D[k][i],a:m[1],k,x:+m[2],y:+m[3]+OY[k]}));
function mapSVG(sel,zoom){const s=30,g=G,own=TL.find(t=>t.n==sel),ds=t=>Math.hypot(t.x-own.x,t.y-own.y);
const war=!!g&&g.mode=="war",al=[];
const rad=war?1.5+(g.r-1)*.35:0;let vb=[0,0,11*s,16*s];
if(zoom){vb=[cl(own.x-3,0,4)*s,cl(own.y-3,0,9)*s,7*s,7*s]}
return `<svg viewBox="${vb}" role="img" aria-label="Tile map of North America">`+TL.map(t=>{
const o=!!(t==own||(g&&g.own&&g.own[t.n])),st=g&&g.al&&g.al[t.n],a=!!st&&st.k!="loyalist",f=!o&&!a&&(st?st.k=="loyalist":war&&ds(t)<=rad);
const fill=o?"var(--ac)":a?(st.b=="close"?"var(--gn)":"var(--yl)"):f?"var(--rd)":"var(--card)";
return `<rect data-t="${t.n}" x="${t.x*s+1}" y="${t.y*s+1}" width="${s-2}" height="${s-2}" rx="5" fill="${fill}" fill-opacity="${f?.55:1}" stroke="${o&&war?"var(--rd)":"var(--bd)"}" stroke-width="${o&&war?3:1}"/><text x="${t.x*s+s/2}" y="${t.y*s+s/2+3}" text-anchor="middle" fill="${o||a?"var(--on)":"var(--tx)"}">${t.a}</text>`}).join("")+`</svg>`}
function mapCard(){const g=G;return `<div class="card map">${mapSVG(g.s,g.zoom)}${allyList()}<div class="st" style="margin:6px 0 0;gap:8px;align-items:center"><span>Blue: you · Green: close allies · Gold: rival allies${g.mode=="war"?" · Red: federal advance":""}</span><button id="zm" style="padding:4px 10px;font-size:12px">${g.zoom?"Full map":"Zoom in"}</button></div></div>`}
function showMap(){const v=$("#sel").value;$("#map").innerHTML=mapSVG(v,false)+`<p class="mu" style="margin:6px 0 0;text-align:center">${v}</p>`;document.querySelectorAll("[data-t]").forEach(r=>r.onclick=()=>{$("#sel").value=r.dataset.t;showMap()})}
const C={
US:{cap:"Washington",l:"President",gov:"Governor",g:"National Guard",k:1,loss:["Charges of Mutiny and Sedition","Under the Uniform Code of Military Justice (UCMJ), any guard member who refuses a lawful order from the President faces charges of Mutiny or Sedition (Article 94). During a time of war or rebellion, this charge carries the maximum penalty of death.",["Mass Court-Martials: Defiant officers and soldiers would be stripped of their rank, dishonorably discharged, and placed into federal military prisons awaiting trial.","Civilian Leadership Arrests: The Governor and complicit state officials would be actively hunted and arrested by federal law enforcement (such as the FBI and U.S. Marshals), backed by tactical military assets, to face federal indictments for insurrection."]]},
CA:{cap:"Ottawa",l:"Prime Minister",gov:"Premier",g:"Provincial Guard",k:.85,loss:["Charges of Mutiny and Sedition","Under Canada’s National Defence Act and Criminal Code, soldiers who defy lawful orders face charges of Mutiny, and leaders of an uprising face charges of Sedition and Treason.",["Mass Courts Martial: Defiant officers and soldiers would be stripped of rank, dishonourably discharged, and held by military police awaiting trial.","Civilian Leadership Arrests: The Premier and complicit provincial officials would be hunted and arrested by the RCMP, backed by military assets, to face federal charges."]]},
MX:{cap:"Mexico City",l:"President",gov:"Governor",g:"State Guard",k:.8,loss:["Charges of Rebellion and Sedition","Under Mexico’s military justice code and federal penal code, soldiers who defy lawful orders face charges of insubordination and rebellion, and leaders of an uprising face charges of Rebellion and Sedition.",["Mass Courts-Martial: Defiant officers and soldiers would be stripped of rank, discharged in disgrace, and jailed in military prisons awaiting trial.","Civilian Leadership Arrests: The Governor and complicit state officials would be hunted and arrested by federal agents, backed by the armed forces, to face federal charges."]]}};
const CH={gov:["Governor","#4d9bff"],gen:["General","#4fc275"],aide:["Aide","#f0b955"],agent:["Federal Agent","#ff8a65"],pres:["President","#ff5d5d"]};
let G=null;
const nm=w=>(G&&G.c&&{gov:G.c.gov,pres:G.c.l}[w])||CH[w][0];
function face(w,m){const c=CH[w][1];
const B={angry:"M9 13l8 4M31 13l-8 4",worried:"M9 16l8-4M31 16l-8-4",stern:"M9 14h8M23 14h8",smug:"M9 15h8M23 12l8 2"}[m]||"";
const M={neutral:"M14 28h12",happy:"M12 25q8 9 16 0",smug:"M13 27q8 5 15-3",angry:"M13 31q7-7 14 0",worried:"M13 30q3-3 7 0t7 0",stern:"M14 29h12",shocked:"M20 26a3 3 0 1 0 .01 0"}[m]||"M14 28h12";
const X={gen:`<path d="M5 12Q20-6 35 12z" fill="${c}" stroke="none"/>`,agent:`<rect x="9" y="16" width="9" height="5" rx="1" fill="#111" stroke="none"/><rect x="22" y="16" width="9" height="5" rx="1" fill="#111" stroke="none"/>`,pres:`<path d="M8 11Q20-1 32 11" stroke="${c}" stroke-width="3"/>`,gov:`<path d="M10 6h20v5H10z" fill="${c}" stroke="none"/>`}[w]||"";
const E=w=="agent"?"":`<circle cx="14" cy="20" r="1.8" fill="currentColor" stroke="none"/><circle cx="26" cy="20" r="1.8" fill="currentColor" stroke="none"/>`;
return `<svg viewBox="0 0 40 40" style="color:var(--tx);border-color:${c}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="21" r="15" style="fill:var(--card)"/>${E}<path d="${B}"/><path d="${M}"/>${X}</svg>`}
const bub=(w,m,t)=>`<div class="bub"><div class="fc">${face(w,m)}${nm(w)}</div><div class="sp">${t}</div></div>`;
const hash=s=>{let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))%9973;return x};
const bar=(l,v,c,t)=>`<div><div class="st"><span>${l}</span><b>${t??Math.round(v)}</b></div><div class="bar"><i style="width:${cl(v)}%;background:${c}"></i></div></div>`;
const clampS=()=>{["arms","loy","plan","fort","ally","sus"].forEach(k=>G[k]=cl(G[k]));G.funds=Math.max(0,G.funds)};

const A=[
["Recruit Guard Units","−$10M · +troops · +risk",10,g=>{g.troops+=ri(8,13);g.sus+=8},["gen","happy","Fresh volunteers are filling the reserve rolls. Nobody outside the unit knows why."]],
["Stockpile Arms","−$12M · +arms · +risk",12,g=>{g.arms+=10;g.sus+=8},["gen","neutral","Crates are moving at night. The armory logs say “training equipment.”"]],
["Raise Funds","+funds · small risk",0,g=>{g.funds+=ri(12,18);g.sus+=3},["aide","happy","The donors came through. Nobody asked what the money was for."]],
["Win Over Officers","−$5M · +loyalty · some risk",5,g=>{g.loy+=ri(8,12);g.sus+=4},["gen","stern","I sat down with the battalion commanders. They’ll hold the line even if the top brass orders them to stand down."]],
["Plan Contingencies","+battle plan · low risk",0,g=>{g.plan+=ri(10,14);g.sus+=2},["aide","neutral","Chain of command, comms blackouts, and who answers to whom when the capital calls. It’s all drawn up."]],
["Build Fortifications","−$8M · +forts · +risk",8,g=>{g.fort+=10;g.sus+=5},["gen","neutral","Roadblocks and supply caches are set at the key bridges and highways."]],
["Send the Form","−$5M · +governor ally · +risk",5,g=>{g.ally+=ri(6,10);g.sus+=5},["aide","worried","Back-channel calls made. A few neighbors say they’ll look the other way, or send help."]],
["Lay Low","−risk · nothing else",0,g=>{g.sus-=15},["aide","happy","A quiet week. Attention is fading. Good."]],["Help an Ally","−$8M · build bonds · small risk",8,g=>{},["aide","neutral",""]]];

const EV=[
d=>seq([["agent","stern","Routine audit of your guard’s equipment logs. Nothing personal."],["aide","worried","They’re going through the armory books right now…"]],()=>{
 if(Math.random()*100<G.sus){G.sus+=10;G.funds-=8;seq([["agent","smug","Some of these numbers don’t add up. We’ll be back."],["gov","angry","Move the crates. Tonight."]],d)}
 else{G.sus-=5;seq([["agent","neutral","Everything checks out. Good day."],["aide","happy","Phew. That was close."]],d)}}),
d=>ask("gen","worried","Colonel Reyes is asking why we’re stockpiling. He’s wavering.",[["Persuade him (+loyalty, +risk)",()=>{G.loy+=8;G.sus+=6;seq([["gov","stern","Colonel, when the day comes I need you with us."],["gen","happy","He’s in. For now."]],d)}],["Reassign him (−loyalty, −risk)",()=>{G.loy-=6;G.sus-=6;seq([["gen","neutral","Reyes has been moved to a desk job. Quietly."]],d)}]]),
d=>seq([["aide","happy","A wealthy donor wants to meet. He dislikes the federal government even more than you do."],["gov","smug","Take the money."]],()=>{G.funds+=15;d()}),
d=>ask("aide","shocked","A reporter is asking about unusual guard movements!",[["Stonewall (+risk)",()=>{G.sus+=10;seq([["gov","stern","No comment."],["aide","worried","They printed “no comment” in bold. That’s never good."]],d)}],["Cover story (−$6M)",()=>{G.funds-=6;G.sus-=6;seq([["gov","happy","It’s a disaster-response drill."],["aide","happy","The paper bought it."]],d)}]]),
d=>seq([["agent","neutral","Federal units are rotating through the region for “training exercises.”"],["gen","angry","That’s no coincidence. They suspect something."]],()=>{G.ready++;G.sus+=4;d()}),
d=>seq([["gen","happy","Veterans’ groups are offering to stand with us. Hundreds of them."]],()=>{G.troops+=6;G.loy+=4;d()})];

const S=[["Hold the Line","Strong defense, steady losses",.7,.6],["Counterattack","Hit hard, take heavy losses",1.4,1.2],["Guerrilla Raids","Better with a good battle plan",null,.5],["Rally Reinforcements","Recruits fade as the war drags on",.3,.8]];

function draw(){if(G.mode=="camp")return drawCamp();const g=G,war=g.mode=="war";
let h=`<h1>${g.s}</h1><p class="mu">${war?`War · Round ${Math.min(g.r,10)} of 10`:`Secret preparation · Week ${g.w} · ${g.ap} action${g.ap==1?"":"s"} left`}</p>`;
h+=mapCard()+`<div class="card grid">`+(war?[bar("Your troops",g.troops,"var(--ac)",Math.round(g.troops)+"k"),bar("Federal force",g.fed/2.2,"var(--rd)",Math.round(g.fed)+"k"),bar("Federal morale",g.mor,"var(--yl)"),bar("Arms · forts",(g.arms+g.fort)/2,"var(--gn)",g.arms+" · "+g.fort)]:[bar("Troops",g.troops,"var(--ac)",g.troops+"k"),bar("Arms",g.arms,"var(--yl)"),bar("Funds",g.funds,"var(--gn)","$"+g.funds+"M"),bar("Guard loyalty",g.loy,"var(--ac)"),bar("Battle plan",g.plan,"var(--ac)"),bar("Fortifications",g.fort,"var(--yl)"),bar("Allies",g.ally,"var(--gn)"),bar("Suspicion (100 = exposed)",g.sus,"var(--rd)")]).join("")+`</div>`;
h+=`<div class="card">${g.sc}</div><div class="grid">${g.busy||(war?S.map((s,i)=>`<button data-a="${i}">${s[0]}<small>${s[1]}</small></button>`).join(""):A.map((a,i)=>`<button data-a="${i}" ${g.ap<1||g.funds<a[2]?"disabled":""}>${a[0]}<small>${a[1]}</small></button>`).join("")+`<button class="pri bad" id="go" style="grid-column:1/-1">Declare rebellion now</button>`)}</div>`;
$("#app").innerHTML=h;
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>war?fight(+b.dataset.a):act(+b.dataset.a));
const go=$("#go");if(go)go.onclick=confirmGo;const zm=$("#zm");if(zm)zm.onclick=()=>{G.zoom=!G.zoom;draw()}}

function confirmGo(){const g=G,s=Math.round(g.sus);g.sc=bub("aide",s>=60?"worried":"shocked",`Governor, are you certain? Suspicion is at ${s}.${s<40?" We are well hidden and could keep building.":""} Once we rise, there is no going back.`);g.busy=`<button class="pri bad" id="y">Yes, declare rebellion</button><button id="n">Not yet</button>`;draw();$("#y").onclick=()=>{g.busy=null;launch()};$("#n").onclick=()=>{g.busy=null;g.sc=bub("aide","happy","Wise. We keep preparing.");draw()}}
const TY={
idealist:["Freedom Firebrand","Resist it openly.","Run by the people of the states.","they’ll gladly unify with us once we’re free.",8],
opportunist:["Power Broker","Weigh what I can gain.","Whoever is in charge, as long as I benefit.","they’ll help, but they’ll want to lead. Expect a rivalry later.",6],
autonomist:["Lone Wolf","Ignore it and keep to ourselves.","Small, local, and left alone.","they’ll help us break away, but they’ll never kneel to us. A rival once we’re independent.",5],
pragmatist:["Fence Sitter","Follow it unless it hurts us.","Whatever works.","they’ll back us if we look strong.",3],
loyalist:["Loyalist","Obey. It’s the law.","The union exactly as it is.","they’re loyal to the capital, and may have just tipped off the feds!",0]};
const after=()=>{clampS();if(G.sus>=100)return exposed();if(G.ap<1)return cont("End the week ▸",endWeek);draw()};
const allyList=()=>{const e=Object.entries(G.al);return e.length?`<p class="mu" style="margin:6px 0 0">${e.map(([n,s])=>n+(s.k=="loyalist"?" (loyalist)":s.b=="close"?" (close "+s.c+")":" (rival "+s.c+")")).join(", ")}</p>`:""};
function helpPick(){const g=G,e=Object.keys(g.al).filter(n=>g.al[n].k!="loyalist"&&!g.own[n]);
if(!e.length){g.sc=bub("aide","neutral","We have no allies to help yet. Send a form to a governor first.");return draw()}
g.sc=bub("aide","neutral","Which ally should we help? Every favor brings them closer, and a rival can be won over once the bond passes 50.");
g.busy=`<select id="ht" style="grid-column:1/-1">${e.map(n=>`<option value="${n}">${n} · ${g.al[n].b}, bond ${g.al[n].c}</option>`).join("")}</select><button class="pri" id="hs">Help them</button><button id="hx">Cancel</button>`;draw();
$("#hx").onclick=()=>{g.busy=null;draw()};$("#hs").onclick=()=>help($("#ht").value)}
function help(n){const g=G,s=g.al[n],camp=g.mode=="camp";if(!s)return;g.funds-=8;g.ally+=2;s.c=cl(s.c+ri(15,25));const was=s.b;s.b=s.c>=50?"close":"rival";
if(!camp){g.ap--;g.sus+=3}
g.busy=null;const how=["sent grain and fuel trucks","lent engineers to rebuild after the storms","covered a gap in their budget","trained their guard alongside ours"][ri(0,3)];
seq([["gov","happy",`We ${how} for ${n}.`],["aide",s.b=="close"?"happy":"neutral",was!=s.b?`${n}’s governor is warming to us. They now count as a close ally.`:s.b=="close"?`${n} trusts us more than ever. Bond: ${s.c}.`:`${n} is grateful, but still keeps us at arm’s length. Bond: ${s.c}.`]],camp?()=>{g.turn++;draw()}:after)}
function formPick(){const g=G;g.sc=bub("aide","neutral","Which governor gets the “state budget survey”? Their answers will tell us who they really are. Tap a tile or use the list.");
g.busy=`<select id="ft" style="grid-column:1/-1">${TL.filter(t=>t.n!=g.s&&!g.al[t.n]).map(t=>`<option>${t.n}</option>`).join("")}</select><button class="pri" id="fs">Send form</button><button id="fx">Cancel</button>`;draw();
$("#fx").onclick=()=>{g.busy=null;draw()};$("#fs").onclick=()=>sendForm($("#ft").value);
document.querySelectorAll("[data-t]").forEach(r=>r.onclick=()=>{if(!g.al[r.dataset.t]&&r.dataset.t!=g.s)$("#ft").value=r.dataset.t})}
function sendForm(n){const g=G,t=TL.find(x=>x.n==n);if(!t)return;
if(g.al[n]){g.busy=null;g.sc=bub("aide","neutral",`${n}’s governor already filled it out.`);return draw()}
const camp=g.mode=="camp",r=Math.random(),k=r<.08?"loyalist":r<.38?"idealist":r<.62?"opportunist":r<.82?"autonomist":"pragmatist",y=TY[k];
const c={idealist:70,pragmatist:Math.random()<.5?50:30,opportunist:25,autonomist:15,loyalist:0}[k];g.al[n]={k,c,b:c>=50?"close":"rival"};g.funds-=5;
if(!camp){g.ap--;g.sus+=3;if(k=="loyalist"){g.sus+=15;g.ready++}}
